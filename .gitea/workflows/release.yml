# Manufacturing release workflow for KiCad projects (Gitea Actions).
# Generated by KiForge (templates/gitea-release.yml).
name: Manufacturing Release (Gitea)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Run KiForge
        uses: https://github.com/alphaseneca/kiforge@main
        with:
          project-path: '.'
          output-dir: 'kiforge'
          export-3d: 'false'
          export-svg: 'false'
          export-homebrew-pdf: 'false'
          export-bom: 'true'
          export-sch-pdf: 'false'
          export-pos: 'true'
          export-step: 'false'
          export-gerbers: 'true'
          export-drills: 'true'
          export-ibom: 'false'
          format-jlc: 'true'
          pos-side: 'both'
          pos-smd-only: 'false'
          pos-exclude-dnp: 'false'
          step-subst-models: 'true'
          bom-include-mfr-mpn: 'true'

      - name: Create release and upload assets
        uses: https://github.com/softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: kiforge/*
          overwrite: true
          overwrite_files: true
